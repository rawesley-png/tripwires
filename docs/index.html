<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tripwires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,400;87.5,500;87.5,700;100,400;100,500&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --panel: #E6E8E6; --tile: #F5F6F4; --tile-edge: #C6CAC5;
    --ink: #22251F; --ink-2: #5C6157; --ink-3: #8C9186;
    --green: #2F7D4F; --amber: #B8830E; --red: #B33A2C; --lamp-off: #C4C6BE; --ring: #B33A2C; --focus: #22251F;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: #1B1E1D; --tile: #252927; --tile-edge: #3A403C;
      --ink: #EDEEE8; --ink-2: #B4B8AE; --ink-3: #7F857B;
      --green: #56B57E; --amber: #E0A93A; --red: #E2604F; --lamp-off: #4A4E47; --ring: #E2604F; --focus: #EDEEE8;
    }
  }
  :root[data-theme="dark"] {
    --panel: #1B1E1D; --tile: #252927; --tile-edge: #3A403C;
    --ink: #EDEEE8; --ink-2: #B4B8AE; --ink-3: #7F857B;
    --green: #56B57E; --amber: #E0A93A; --red: #E2604F; --lamp-off: #4A4E47; --ring: #E2604F; --focus: #EDEEE8;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--panel); color: var(--ink); font-family: "Archivo", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-variation-settings: "wdth" 100; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 18px 56px; }
  .switch { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; display: flex; gap: 8px; margin-bottom: 18px; }
  .switch button { flex: 1; font: inherit; font-weight: 500; padding: 12px 10px; border-radius: 10px; border: 1.5px solid var(--tile-edge); background: var(--tile); color: var(--ink-2); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .switch button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
  .switch button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .switch .count { display: inline-flex; gap: 5px; }
  .switch .count i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; margin-bottom: 14px; }
  h1 { font-size: 30px; line-height: 1.1; margin: 0; font-weight: 700; font-variation-settings: "wdth" 87.5; letter-spacing: -0.01em; }
  .stamp { color: var(--ink-2); font-size: 14px; }
  .summary { font-size: 17px; margin: 0 0 20px; max-width: 62ch; }
  .gate { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; background: var(--tile); border: 1.5px solid var(--tile-edge); border-radius: 10px; padding: 18px 20px; margin-bottom: 8px; }
  .gate.rung { border-color: var(--ring); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ring) 22%, transparent); }
  .gate svg { width: 56px; height: 56px; display: block; }
  .gate .title { font-weight: 700; font-size: 18px; font-variation-settings: "wdth" 87.5; margin: 0 0 3px; }
  .gate p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .gate .parts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
  .gate .parts span { display: inline-flex; align-items: center; gap: 7px; }
  .gate .parts i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--lamp-off); }
  .section { margin: 26px 0 10px; }
  .section h3 { margin: 0 0 2px; font-size: 19px; font-weight: 700; font-variation-settings: "wdth" 87.5; }
  .section p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 700px) { .grid { grid-template-columns: 1fr 1fr; } }
  .tile { background: var(--tile); border: 1.5px solid var(--tile-edge); border-radius: 10px; padding: 16px 18px 14px; display: grid; grid-template-columns: 22px 1fr; gap: 6px 14px; cursor: pointer; }
  .tile:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .tile.red { border-color: color-mix(in srgb, var(--red) 55%, var(--tile-edge)); }
  .tile.amber { border-color: color-mix(in srgb, var(--amber) 55%, var(--tile-edge)); }
  .lamp { width: 18px; height: 18px; border-radius: 50%; background: var(--lamp-off); margin-top: 3px; grid-row: 1 / span 2; }
  i.green, .lamp.green { background: var(--green); } i.amber, .lamp.amber { background: var(--amber); } i.red, .lamp.red { background: var(--red); }
  .lamp.green { box-shadow: 0 0 10px color-mix(in srgb, var(--green) 55%, transparent); }
  .lamp.amber { box-shadow: 0 0 12px color-mix(in srgb, var(--amber) 70%, transparent); }
  .lamp.red { box-shadow: 0 0 14px color-mix(in srgb, var(--red) 75%, transparent); }
  .tile h2 { margin: 0; font-size: 17px; font-weight: 700; font-variation-settings: "wdth" 87.5; line-height: 1.2; }
  .tile .tag { grid-column: 2; margin: 0 0 2px; font-size: 12.5px; color: var(--ink-3); }
  .tile .q { color: var(--ink-2); font-size: 14px; grid-column: 2; margin: 0; }
  .tile .reading { grid-column: 2; margin: 8px 0 0; font-size: 15px; }
  .tile .trip { grid-column: 2; color: var(--ink-3); font-size: 13px; margin: 3px 0 0; }
  .tile .subs { grid-column: 2; list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .tile .subs li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; align-items: start; font-size: 14px; }
  .tile .subs i { width: 11px; height: 11px; border-radius: 50%; margin-top: 5px; display: inline-block; background: var(--lamp-off); }
  .tile .subs b { font-weight: 500; } .tile .subs span { color: var(--ink-2); }
  .tile .foot { grid-column: 2; display: flex; justify-content: space-between; align-items: end; gap: 10px; margin-top: 10px; color: var(--ink-3); font-size: 12.5px; }
  .tile svg.spark { width: 84px; height: 22px; flex: none; }
  .tile .more { grid-column: 2; display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--tile-edge); font-size: 14px; color: var(--ink-2); }
  .tile .more a { color: var(--ink); overflow-wrap: anywhere; }
  .tile.open .more { display: block; }
  .status-word { font-weight: 500; }
  .status-word.green { color: var(--green); } .status-word.amber { color: var(--amber); } .status-word.red { color: var(--red); }
  .legend { margin: 26px 0 0; color: var(--ink-2); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 22px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .note { margin: 18px 0 0; color: var(--ink-3); font-size: 13.5px; max-width: 70ch; }
</style>
</head>
<body>
<div class="wrap">
  <div class="switch" role="tablist" id="switch"></div>
  <header><h1 id="title"></h1><div class="stamp" id="stamp"></div></header>
  <p class="summary" id="summary"></p>
  <div class="gate" id="gate" role="status"></div>
  <div id="grid"></div>
  <div class="legend">
    <span><i style="background:var(--green)"></i>Calm</span>
    <span><i style="background:var(--amber)"></i>Watch</span>
    <span><i style="background:var(--red)"></i>Tripped</span>
    <span>Tap a tile for the evidence</span>
  </div>
  <p class="note" id="note"></p>
</div>

title": "Whether a decision has been made", "blurb": "The signs that can't be hidden once a move is under way."}], "tiles": [{"id": "k1", "board": "taiwan", "group": "reason", "tag": "Reason: a red line crossed", "name": "Taipei's red lines", "question": "Has Taiwan taken a formal step toward independence, or has the U.S. recognized it?", "trip": "Trips on a referendum, a constitutional change to name or territory, a declaration, U.S. recognition, or U.S. troops. The one thing that makes a Chinese move near-certain.", "status": "GREEN", "reading": "As of Sep 25 2026, the DPP has made no attempt to change the constitution; a formal independence amendment would require 75% legislative supermajority (impossible given equal DPP-KMT seat split) and then a nationwide referendum clearing 50% of all eligible voters — a threshold analysts call 'mission impossible.' No US recognition, defense treaty, or permanent US troop basing announced.", "evidence": "Written into China's 2005 Anti-Secession Law; every leader since has repeated it.", "source": "Web check", "value": null, "subs": null, "url": "https://www.usnews.com/news/world/articles/2026-09-24/explainer-what-is-taiwan-independence-and-is-taiwan-already-independent", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": null}]}, {"id": "k2", "board": "taiwan", "group": "reason", "tag": "Reason: Beijing declares the peaceful path dead", "name": "Beijing's language", "question": "Has Beijing stopped saying 'peaceful reunification', or declared peaceful means exhausted?", "trip": "Trips when Beijing invokes the Anti-Secession Law's third condition or drops the peaceful framing. Amber when the KMT route is failing.", "status": "AMBER", "reading": "On Sep 24 2026 Xi pressed Trump at the White House to 'oppose' (not merely 'not support') Taiwan independence — a new and escalated formulation; Xi's Dec 31 2025 New Year address called reunification 'unstoppable' and institutionalized 'Taiwan Recovery Day'; peaceful reunification formula still nominally intact but Xi is conditioning US-China cooperation explicitly on Taiwan handling.", "evidence": "The third legal trigger is a judgment call Xi controls — which is exactly why he can wait.", "source": "Web check", "value": null, "subs": null, "url": "https://www.bloomberg.com/news/articles/2026-09-24/xi-presses-trump-to-oppose-taiwan-independence-during-summit", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": null}]}, {"id": "k3", "board": "taiwan", "group": "reason", "tag": "Feeds the reason", "name": "Taiwan's politics", "question": "Is Xi's peaceful route — a KMT government in 2028 — still alive?", "trip": "Amber if the KMT is losing ground or Beijing's engagement backfires; a DPP win in January 2028 is the hinge.", "status": "AMBER", "reading": "KMT chair Cheng Li-wun met Xi in Beijing on Apr 10 2026 — first such meeting in nearly a decade — and KMT-TPP formed a cooperation alliance for Nov 28 2026 local elections; prediction markets price KMT winning at 81% probability; analysts warn that if DPP wins a 4th presidential term in 2028, Xi may conclude peaceful unification via the KMT is no longer viable.", "evidence": "January 2028 is the face trap: if the KMT loses after Xi hosted its chair, the peaceful story loses its vehicle.", "source": "Web check; polls", "value": null, "subs": null, "url": "https://www.cnbc.com/2026/04/10/china-taiwan-reunification-cross-strait-relations-trump-visit-may-.html", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": null}]}, {"id": "k4", "board": "taiwan", "group": "opening", "tag": "Opening", "name": "U.S. commitment", "question": "Does Washington look willing and able to fight for Taiwan?", "trip": "Amber when arms sales are paused, statements hedge, or carriers are elsewhere; red on an explicit statement of non-defense.", "status": "AMBER", "reading": "Trump described the $14bn arms package as a anyone believes help is coming.", "source": "Polls via web check", "value": 58.7, "subs": null, "url": "https://theonlinecitizen.com/2026/03/13/most-taiwanese-would-resist-chinese-invasion-even-without-us-support-survey-finds/", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": 58.7}]}, {"id": "k10", "board": "taiwan", "group": "decision", "tag": "Decision", "name": "From drills to inspections", "question": "Has China moved from exercises to actually stopping ships?", "trip": "Trips on any coast-guard boarding or inspection of Taiwan-bound shipping, or a declared quarantine. Drills alone stay green.", "status": "AMBER", "reading": "No confirmed actual boarding or quarantine of Taiwan-bound shipping as of Sep 25 2026; however since Jul 2026 China Coast Guard began regularized patrols east of Taiwan for first time, described by Al Jazeera (Jul 29) as rehearsing a containment strategy; Sep 5 and Sep 9 PLA conducted joint combat readiness patrols with aircraft in Taiwan's northern, central, and eastern airspace; H1 2026 daily average ~7.5 PLA aircraft sorties around Taiwan; Aug 2026 sorties down from 2025 peak but coast guard presence widened; 15 documented CCG incursions into Taiwan's restricted waters Jan-Mar 2026.", "evidence": "Drills are cheap face; inspections are the first act of a blockade.", "source": "Web check; Taiwan MND", "value": null, "subs": null, "url": "https://www.aljazeera.com/news/2026/7/29/china-puts-squeeze-on-taiwan-with-new-maritime-patrols", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": null}]}, {"id": "k11", "board": "taiwan", "group": "decision", "tag": "Decision", "name": "Mobilization signs", "question": "Is China doing the things a country does in the months before it fights?", "trip": "Amber on preparatory steps (ferry requisition drills, reserve call-ups, mobilization-law changes); red on several at once.", "status": "AMBER", "reading": "China revised its Nat spike detected in searched sources.", "evidence": "Markets price the decision before governments announce it; they also panic for other reasons, so this confirms rather than triggers.", "source": "Yahoo Finance; Polymarket; web check", "value": 11.5, "subs": null, "url": "https://polymarketanalytics.com/event/will-china-invade-taiwan-before-2027", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": 11.5}]}]}, {"key": "plumbing", "title": "Plumbing tripwires", "summary": "3 tripped, 9 on watch, of 15. Stage 0 of 4 — every ingredient, no event: the buffer is gone and a drain day is near.", "gate": {"kind": "stages", "rung": false, "title": "Stage 0 of 4 — every ingredient, no event: the buffer is gone and a drain day is near", "text": "A seizure needs two ingredients in place — no buffer, and a drain day — and then runs through four stages: (1) a spike in overnight rates; (2) the spike stays, which rings the bell; (3) transmission into Treasuries and stocks, the meltdown path; (4) the Fed fails to act, the confidence-break path. Stage decides whether it is a plumbing story (2019 stopped at stage 2) or a market one (March 2020 reached stage 3 for ten days).", "parts": [{"name": "Ingredient: buffer gone", "status": "RED"}, {"name": "Ingredient: drain day near", "status": "AMBER"}, {"name": "Stage 1: spike", "status": "GREEN"}, {"name": "Stage 2: spike stays — the bell", "status": "GREEN"}, {"name": "Stage 3: transmission to markets", "status": "AMBER"}, {"name": "Stage 4: Fed fails to act", "status": "AMBER"}]}, "groups": [{"key": "repo", "title": "The overnight market", "blurb": "The domestic repo market: about $3 trillion a day, re-agreed every morning. Watch the days, not the level."}, {"key": "offshore", "title": "The offshore dollar", "blurb": "The eurodollar system: the same trade done abroad with a currency as the pawn, through the same dealers."}, {"key": "floors", "title": "The new floors", "blurb": "The layers stacked on top ": "AMBER", "value": 5}]}, {"id": "r5", "board": "plumbing", "group": "repo", "tag": "Overnight", "name": "Treasury market function", "question": "Can the basis trade be unwound without breaking the market?", "trip": "Red on a failed or badly tailed coupon auction, dealers refusing balance sheet, bond volatility (MOVE) above 140, or bid-ask spreads widening the way they did in March 2020. Amber with MOVE above 100.", "status": "RED", "reading": "MOVE index 105. Sep 23, 2026: $70bn 5-year note auctioned at 5.033% with a 3.1 bp tail (second-largest on record), bid-to-cover of 2.212 (weakest since Dec 2018), and primary dealers absorbed 15.8% of the offering.", "evidence": "March 2020: repo tightened, the basis trade could not roll, Treasuries were dumped, and the Fed bought $75 billion a day. Ten days start to finish.", "source": "Yahoo Finance ^MOVE; auction results via web check", "value": 105.0, "subs": null, "url": "https://www.tftc.io/5-year-treasury-auction-5-percent-yield-second-biggest-tail-record", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "RED", "value": 105.0}]}, {"id": "r6", "board": "plumbing", "group": "repo", "tag": "Overnight", "name": "Bank stress", "question": "Are the lenders worried about each other?", "trip": "Red on a spike in a large bank's default-insurance cost or discount-window borrowing above $50 billion. Amber above $10 billion, or if uninsured deposits start moving to money funds again.", "status": "AMBER", "reading": "Discount-window primary credit $6.2 billion (week of 2026-09-23). No publicly reported large-bank CDS spike or emergency discount-window draws in the past 30 days; however the Sep 23 5-year auction cascade placed ~$11bn on dealer balance sheets, raising intermediation-cost concerns heading into quarter-end.", "evidence": "March 2023: $42 billion left one bank in a day through an app. The next run will be as fast.", "source": "FRED: WLCFLPCL; bank CDS via web check", "value": 6.2, "subs": null, "url": "https://www.tftc.io/5-year-treasury-auction-5-percent-yield-second-biggest-tail-record", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 6.2}]}, {"id": "e1", "board": "plumbing", "group": "offshore", "tag": "Offshore", "name": "The dollar shortage gauge", "question": "Are foreigners paying extra to borrow dollars through swaps?", "trip": "Amber past -30 basis points outside a quarter-end; red at -60 and beyond, the dealers refusing to extend balance sheet. March 2020 reached -150 on the yen.", "status": "AMBER", "reading": "3-month EUR/USD xccy basis was approximately -16 to -20 bp as of mid-May 2026 (tighter than 2023 levels); Japan's $550bn US trade deal is expected to push the JPY/USD 5–10yr basis meaningfully more negative in 2026, and quarter-end Sep 30 pressure is building; exact Sep 25 live quote unavailable but approaching AMBER zone ahead of quarter-end.", "evidence": "When the swap market seizes, foreign holders do not default — they sell Treasuries. An offshore funding problem becomes a Treasury problem in the same week.", "source": "Cross-currency basis via web check", "value": null, "subs": null, "url": "https://convextrade.com/glossary/eurodollar-basis", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": null}]}, {"id": "e2", "board": "plumbing", "group": "offshore", "tag": "Offshore", "name": "The Fed's swap lines", "question": "Are foreign central banks drawing dollars from the Fed?", "trip": "Red at $50 billion drawn; amber at $5 billion. Any non-trivial draw means the private swap market has stopped working somewhere.", "status": "GREEN", "reading": "Central-bank liquidity swaps outstanding $0.1 billion (week of 2026-09-23). Peaks: $580 billion in 2008, $450 billion in 2020.", "evidence": "The swap lines have worked every time they were used, for the fourteen countries that have them.", "source": "FRED: SWPT", "value": 0.1, "subs": null, "url": null, "checked": "2026 : 0.9, "subs": null, "url": "https://cryptobriefing.com/us-treasury-basis-trade-shrinks-two-year-low/", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 0.9}]}, {"id": "n2", "board": "plumbing", "group": "floors", "tag": "New floor", "name": "Central clearing changeover", "question": "Will the plumbing survive its own repair?", "trip": "Red on a delay announced under pressure, a clearing-house margin call that cascades, or dealers dropping smaller counterparties in the run-up. Green once both deadlines have passed cleanly.", "status": "AMBER", "reading": "Sep 22, 2026: SEC confirmed at the 2026 Treasury Market Conference it does not intend to extend Dec 31, 2026 (cash) or Jun 30, 2027 (repo) deadlines; legal documentation bottlenecks persist as the largest implementation challenge, and extraterritorial scope questions remain unresolved.", "evidence": "The clearing house becomes the too-big-to-fail node: 2020 and the 2022 nickel blowup showed what a margin spiral looks like.", "source": "SEC; FICC via web check", "value": null, "subs": null, "url": "https://www.sec.gov/newsroom/speeches-statements/uyeda-remarks-2026-u-s-treasury-market-conference-092226", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": null}]}, {"id": "n3", "board": "plumbing", "group": "floors", "tag": "New floor", "name": "Stablecoins", "question": "How large is the new money-fund lookalike with no backstop?", "trip": "Red on a large issuer trading below par for more than a day, or total supply falling 10% in a week. Amber standing.", "status": "GREEN", "reading": "Sep 10, 2026: Total stablecoin market cap ~$302.8bn (USDT $183.4bn, USDC $74.2bn), up +0.37% over prior 7 days; no major issuer reported trading below par; supply is modestly off the May 2026 peak of $322.4bn but decline is gradual and well within the 10%-per-week RED threshold.", "evidence": "2022's Terra collapse and 2023's USDC break were the rehearsals, at he same week.", "source": "FRED: DGS10, DTWEXBGS; Yahoo SPY", "value": 1, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 1}]}, {"id": "q2", "board": "plumbing", "group": "sequence", "tag": "Stage 4", "name": "The Fed's response", "question": "Once a seizure starts, how fast does the Fed lend — and does it stop when the episode ends?", "trip": "Red if a seizure (SOFR 25 bp over the floor for three sessions) runs with no Fed operations. Amber while operations run; green when they end. Purchases that continue after the episode normalizes are step two on the fiscal dominance board.", "status": "AMBER", "reading": "Fed operations under way. Sep 16, 2026 FOMC implementation note: SRP rate set at 4.00%; the Fed directed the Desk to buy T-bills (and shorter Treasuries if needed) via ongoing Reserve Management Purchases at $10bn/month since May 14 to maintain ample reserves—no emergency repo or stress-response purchase operations currently active.", "evidence": "The precedents are days: 48 hours in 2019, ten days in 2020, a weekend in 2023. The Fed has never failed to act on a repo seizure since 1987; the only way this goes red is if it is stopped from acting.", "source": "FRED: SOFR, IORB, RPONTSYD; web check", "value": 0, "subs": null, "url": "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260916a1.htm", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 0}]}]}, {"key": "fiscal", "title": "Fiscal dominance tripwires", "summary": "0 tripped, 5 on watch, of 12. The Fed has taken none of the four steps.", "gate": {"kind": "steps", "rung": false, "title": "The Fed has taken none of the four steps", "text": "The path from central bank to Treasury financier has four steps, each defensible on its own: bill purchases for reserve management; a crisis purchase that outlasts the crisis; political pressure to hold yields down; a stated ceiling. Step one is normal ys-2-12b-in-treasury-bills-as-reserve-management-program-winds-down", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": 12.0}]}, {"id": "s2", "board": "fiscal", "group": "step", "tag": "Step 2", "name": "A crisis purchase that outlasts the crisis", "question": "Has the Fed bought bonds under a financial-stability banner and kept buying after the episode ended?", "trip": "Red if purchases begun in an episode continue after the episode's own indicators (repo rates, auction results) have normalized.", "status": "GREEN", "reading": "No crisis-era purchase program is ongoing; the Dec-2025 RMP program was a reserve-management response to repo-rate stress (SOFR 32 bp above IORB in Oct-2025), and the program has been tapering as money-market conditions normalised, with a planned pause announced for mid-Aug to mid-Sep 2026.", "evidence": "Every crisis purchase since 1987 was justified as temporary; 2008's became permanent. The tell is the second month.", "source": "Fed statements; H.4.1 via web check", "value": null, "subs": null, "url": "https://tellerwindow.newyorkfed.org/2026/03/31/the-implementation-of-reserve-management-purchases-to-maintain-ample-reserves/", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": null}]}, {"id": "s3", "board": "fiscal", "group": "step", "tag": "Step 3", "name": "Political pressure to hold yields down", "question": "Is the executive branch or the Treasury talking about long yields as something the Fed should manage?", "trip": "Red when the Treasury Secretary or the White House names the 10-year as a target in public, or when the Fed's independence is challenged in law.", "status": "AMBER", "reading": "In the week of Sep 4-5 2026 Trump, the VP, Treasury Secretary Bessent and a senior economic counselor all publicly urged the Fed not to hike rates (and in some cases to cut), an unusually broad pressure campaign; Trump posted 'Interest Rates in the United States should b idence": "Breakevens are the cleanest reading of whether the anchor holds; they stayed anchored through 2021 until they didn't.", "source": "FRED: T5YIFR, T10YIE", "value": 2.33, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": 2.33}]}, {"id": "v2", "board": "fiscal", "group": "verdict", "tag": "Verdict", "name": "Gold against real yields", "question": "Is the world buying the one asset that isn't a promise, even while promises pay well?", "trip": "Amber when gold is within 3% of its 52-week high while 30-year real yields sit above 2%. Red when gold makes a new high while real yields rise — the referendum going against the pyramid with the odds still in its favor.", "status": "GREEN", "reading": "Gold $4,312 (52-week high $5,318); 30-year TIPS real yield 3.14% (+0.43 over three months).", "evidence": "Gold has outrun TIPS since 2022 while breakevens stayed flat. It is hedging the regime, not the index.", "source": "Yahoo GC=F; FRED DFII30", "value": 4312.0, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": 4312.0}]}, {"id": "v3", "board": "fiscal", "group": "verdict", "tag": "Verdict", "name": "Foreign demand", "question": "Are foreign official holders still showing up for Treasuries?", "trip": "Red on a badly tailed coupon auction attributed to foreign absence or a sharp fall in the indirect-bidder share; amber on a falling trend, central-bank gold buying, yuan oil settlement.", "status": "AMBER", "reading": "Sep-24 2026 five-year auction ($70 bn at 5.033%) saw indirect bidders take only 54.3% vs a 65.2% average, with dealers absorbing 15.8%; Japan's Treasury holdings are down ~$51 bn over the past year to $1.10 trn; a Sep-11 30-yr auction showed a record-high 79.5% indirect share, illustrating volatile and mixed demand rather than a sustained collapse.", "evidence": "When foreign demand fades, the Fed becomes the marginal buyer whether it wants to or not. That is step one becoming step two by default.", "source": "TIC; auction results via web check", "value": 54.3, "subs": null, "url": "https://moderndiplomacy.eu/2026/09/25/us-treasuries-5-percent-foreign-capital-flows-japan-norway-gulf/", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 54.3}]}, {"id": "v4", "board": "fiscal", "group": "verdict", "tag": "Verdict", "name": "The long end", "question": "Is the market charging more to hold the government's longest promises?", "trip": "Red when the 30-year holds above 5.5% with breakevens unchanged: the premium blowing out on supply alone. Amber above 5%.", "status": "AMBER", "reading": "30-year 5.40% on 2026-09-23; 10-year breakeven +0.02 over three months — a supply premium, not an inflation premium.", "evidence": "A long end rising while expected inflation is flat is the market's own yield-curve control, run against the Treasury.", "source": "FRED: DGS30, T10YIE", "value": 5.4, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 5.4}]}, {"id": "v5", "board": "fiscal", "group": "verdict", "tag": "Verdict", "name": "The dollar itself", "question": "Is money leaving the dollar, or just leaving bonds?", "trip": "Red when the dollar falls more than 5% in a month while long yields rise a quarter point or more — capital leaving the system rather than repricing within it. Amber at 3%.", "status": "GREEN", "reading": "Broad dollar index 119.5, +1.0% over a month; 10-year yield +0.41 over the same period.", "evidence": "In 2008 and 2020 the dollar rose in the crisis. The day it falls in one is the day the fourth pillar is being tested. April 2025 was the preview.", "source": "FRED: DTWEXBGS, DGS10", "value": 119.5, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": 119.5}]}, {"id": "p1", "board": "fiscal", "group": "pressure", "tag": "Pressure", "name": "The arithmetic", "question": "Does the debt cost more than the economy grows?", "trip": "Red when the 10-year yield exceeds nominal GDP growth; amber within a point of it. Interest costs are shown for scale.", "status": "GREEN", "reading": "Nominal GDP growth 6.6% over the year to 2026-04-01; 10-year yield 5.11%; federal interest running at $1,247 billion a year.", "evidence": "Every government at this point on the curve has reached for the bond desk. The arithmetic, not the politics, is what forces the steps.", "source": "FRED: GDP, DGS10, A091RC1Q027SBEA", "value": -1.45, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": -1.45}]}, {"id": "p2", "board": "fiscal", "group": "pressure", "tag": "Pressure", "name": "The plumbing door", "question": "Is a repo or Treasury-market seizure near enough to give the Fed the financial-stability reason to buy?", "trip": "Mirrors the plumbing board: amber while the buffer is gone, red once a seizure is under way. Step two enters through this door.", "status": "AMBER", "reading": "Stage 0 of 4 — every ingredient, no event: the buffer is gone and a drain day is near", "evidence": "The 2019 spike and the March 2020 seizure were both answered with purchases.", "source": "Plumbing board", "value": 0, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 0}]}, {"id": "p3", "board": "fiscal", "group": "pressure", "tag": "Pressure", "name": "The Fed's own position", "question": "Is the Fed politically weaker than it needs to be to keep saying no?", "trip": "Red when the Fed's losses or independence become a legislative target, or a dissent for cuts appears from a governor appointed for that purpose.", "status": "AMBER", "reading": "As of Mar-25 2026 the Fed's consolidated deferred asset stood at $244 bn (up from $216 bn at end-2024); the CRS 119th-Congress report notes CBO projects remittances won't resume until FY2030; Congress is debating Fed reform and oversight in the 119th Congress, and the Republican Policy Committee has published a paper criticising the deferred-asset accounting convention as an unauthorised 'gimmick', though no legislation has been enacted.", "evidence": "An institution that has to defend its own books is easier to pressure than one that doesn't. The deferred asset is about $230 billion.", "source": "Fed financials; Congress via web check", "value": 244.0, "subs": null, "url": "https://www.federalreserve.gov/monetarypolicy/May-2026-Federal-Reserve-Balance-Sheet-Developments.htm", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 244.0}]}]}]}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("tripwire-data").textContent.replace(/^\/\*TRIPWIRE_DATA\*\//, "") || "{}");
  const WORD = { green: "Calm", amber: "Watch", red: "Tripped" };
  const norm = s => ({ green: "green", amber: "amber", yellow: "amber", red: "red" })[String(s || "green").toLowerCase()] || "amber";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const BELL = '<svg viewBox="0 0 56 56" aria-hidden="true"><path class="shape" d="M28 6c1.6 0 3 1.2 3 2.8v1.4c6.7 1.5 11 7.2 11 14.3v9.4l4.2 5.6c.8 1.1 0 2.7-1.4 2.7H11.2c-1.4 0-2.2-1.6-1.4-2.7L14 33.9v-9.4c0-7.1 4.3-12.8 11-14.3V8.8C25 7.2 26.4 6 28 6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M23 45.5a5 5 0 0 0 10 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const GATE = '<svg viewBox="0 0 56 56" aria-hidden="true"><rect class="shape" x="8" y="10" width="40" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><line x1="8" y1="22" x2="48" y2="22" stroke="currentColor" stroke-width="2.4"/><line x1="8" y1="34" x2="48" y2="34" stroke="currentColor" stroke-width="2.4"/></svg>';
  const STEPS = '<svg viewBox="0 0 56 56" aria-hidden="true"><path class="shape" d="M8 48h12V36h12V24h12V12h8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg>';
  const STAGES = '<svg viewBox="0 0 56 56" aria-hidden="true"><path class="shape" d="M10 14h36M10 42h36" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M18 14v28M38 14v28" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M18 28h20" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.5"/></svg>';

  function spark(history) {
    const pts = (history || []).filter(h => typeof h.value === "number");
    if (pts.length < 2) return '<svg class="spark" viewBox="0 0 84 22" aria-hidden="true"><circle cx="78" cy="11" r="2.5" fill="currentColor"/></svg>';
    const vals = pts.map(p => p.value), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1, step = 80 / (pts.length - 1);
    const d = pts.map((p, i) => `${i === 0 ? "M" : "L"}${(2 + i * step).toFixed(1)},${(19 - (p.value - lo) / span * 16).toFixed(1)}`).join(" ");
    return `<svg class="spark" viewBox="0 0 84 22" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
  }

  function tileHtml(it) {
    const s = norm(it.status);
    return `<div class="tile ${s}" tabindex="0" role="button" aria-expanded="false">
      <div class="lamp ${s}" aria-label="${WORD[s]}"></div>
      <h2>${esc(it.name)}</h2>
      ${it.tag ? `<p class="tag">${esc(it.tag)}</p>` : ""}
      <p class="q">${esc(it.question)}</p>
      <p class="reading"><span class="status-word ${s}">${WORD[s]}.</span> ${esc(it.reading)}</p>
      <p class="trip">${esc(it.trip)}</p>
      ${it.subs && it.subs.length ? `<ul class="subs">${it.subs.map(x => `<li><i class="${norm(x.status)}"></i><div><b>${esc(x.name)}.</b> <span>${esc(x.reading)}</span></div></li>`).join("")}</ul>` : ""}
      <div class="foot"><span>${esc(it.source)}${it.checked ? " · " + esc(it.checked) : ""}</span>${spark(it.history)}</div>
      <div class="more">${esc(it.evidence)}${it.url ? ` <a href="${esc(it.url)}" target="_blank" rel="noopener">Source</a>` : ""}</div>
    </div>`;
  }

  function renderBoard(b) {
    document.getElementById("title").textContent = b.title;
    document.getElementById("stamp").textContent = "Checked " + (DATA.updated || "");
    document.getElementById("summary").textContent = b.summary || "";
    const g = b.gate || {};
    const gate = document.getElementById("gate");
    gate.classList.toggle("rung", !!g.rung);
    gate.innerHTML = ({ bell: BELL, steps: STEPS, stages: STAGES }[g.kind] || GATE) + `<div><p class="title">${esc(g.title)}</p><p>${esc(g.text)}</p><div class="parts">${(g.parts || []).map(p => `<span><i class="${norm(p.status)}"></i>${esc(p.name)}</span>`).join("")}</div></div>`;
    if (g.rung) { const sh = gate.querySelector(".shape"); if (sh) sh.setAttribute(g.kind === "steps" || g.kind === "stages" ? "stroke" : "fill", "var(--ring)"); }
    document.getElementById("grid").innerHTML = (b.groups || []).map(gr => {
      const rows = (b.tiles || []).filter(t => t.group === gr.key);
      if (!rows.length) return "";
      return `<div class="section"><h3>${esc(gr.title)}</h3><p>${esc(gr.blurb)}</p></div><div class="grid">${rows.map(tileHtml).join("")}</div>`;
    }).join("");
    document.querySelectorAll(".tile").forEach(t => {
      const toggle = () => { t.classList.toggle("open"); t.setAttribute("aria-expanded", t.classList.contains("open")); };
      t.addEventListener("click", toggle);
      t.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    });
    document.getElementById("note").textContent = (DATA.soft_checked ? "Hard data from FRED, Yahoo Finance, and SEC filings; soft signals from a web check. " : "Hard data only — soft-signal tiles were not checked on this run. ") + "Updated automatically by the tripwires script.";
  }

  const boards = DATA.boards || [];
  const sw = document.getElementById("switch");
  let current = Math.max(0, boards.findIndex(b => "#" + b.key === location.hash));
  function drawSwitch() {
    sw.innerHTML = boards.map((b, i) => {
      const reds = (b.tiles || []).filter(t => norm(t.status) === "red").length, ambers = (b.tiles || []).filter(t => norm(t.status) === "amber").length;
      return `<button role="tab" aria-selected="${i === current}" data-i="${i}">${esc(b.title)}<span class="count">${"<i class=\"red\"></i>".repeat(reds)}${"<i class=\"amber\"></i>".repeat(ambers)}</span></button>`;
    }).join("");
    sw.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => { current = +btn.dataset.i; location.hash = boards[current].key; drawSwitch(); renderBoard(boards[current]); }));
  }
  if (boards.length) { drawSwitch(); renderBoard(boards[current]); }
  addEventListener("hashchange", () => { const i = boards.findIndex(b => "#" + b.key === location.hash); if (i >= 0 && i !== current) { current = i; drawSwitch(); renderBoard(boards[current]); } });
  else { document.getElementById("title").textContent = "Tripwires"; document.getElementById("summary").textContent = "No data yet — run tripwires.py."; document.getElementById("gate").style.display = "none"; }
})();
</script>
