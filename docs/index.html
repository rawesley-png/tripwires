<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tripwires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,400;87.5,500;87.5,700;100,400;100,500&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --panel: #E6E8E6; --tile: #F5F6F4; --tile-edge: #C6CAC5;
    --ink: #22251F; --ink-2: #5C6157; --ink-3: #8C9186;
    --green: #2F7D4F; --amber: #B8830E; --red: #B33A2C; --lamp-off: #C4C6BE; --ring: #B33A2C; --focus: #22251F;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: #1B1E1D; --tile: #252927; --tile-edge: #3A403C;
      --ink: #EDEEE8; --ink-2: #B4B8AE; --ink-3: #7F857B;
      --green: #56B57E; --amber: #E0A93A; --red: #E2604F; --lamp-off: #4A4E47; --ring: #E2604F; --focus: #EDEEE8;
    }
  }
  :root[data-theme="dark"] {
    --panel: #1B1E1D; --tile: #252927; --tile-edge: #3A403C;
    --ink: #EDEEE8; --ink-2: #B4B8AE; --ink-3: #7F857B;
    --green: #56B57E; --amber: #E0A93A; --red: #E2604F; --lamp-off: #4A4E47; --ring: #E2604F; --focus: #EDEEE8;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--panel); color: var(--ink); font-family: "Archivo", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-variation-settings: "wdth" 100; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 18px 56px; }
  .switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .switch button { min-width: 0; font: inherit; font-weight: 500; padding: 11px 8px 10px; border-radius: 10px; border: 1.5px solid var(--tile-edge); background: var(--tile); color: var(--ink-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 7px; text-align: center; line-height: 1.2; }
  .switch button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
  .switch button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .switch .count { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 100%; min-height: 9px; }
  .switch .count i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; margin-bottom: 14px; }
  h1 { font-size: 30px; line-height: 1.1; margin: 0; font-weight: 700; font-variation-settings: "wdth" 87.5; letter-spacing: -0.01em; }
  .stamp { color: var(--ink-2); font-size: 14px; }
  .summary { font-size: 17px; margin: 0 0 20px; max-width: 62ch; }
  .gate { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; background: var(--tile); border: 1.5px solid var(--tile-edge); border-radius: 10px; padding: 18px 20px; margin-bottom: 8px; }
  .gate.rung { border-color: var(--ring); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ring) 22%, transparent); }
  .gate svg { width: 56px; height: 56px; display: block; }
  .gate .title { font-weight: 700; font-size: 18px; font-variation-settings: "wdth" 87.5; margin: 0 0 3px; }
  .gate p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .gate .parts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
  .gate .parts span { display: inline-flex; align-items: center; gap: 7px; }
  .gate .parts i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--lamp-off); }
  .gate .parts i.green { background: var(--green); } .gate .parts i.amber { background: var(--amber); } .gate .parts i.red { background: var(--red); }
  .section { margin: 26px 0 10px; }
  .section h3 { margin: 0 0 2px; font-size: 19px; font-weight: 700; font-variation-settings: "wdth" 87.5; }
  .section p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 700px) { .grid { grid-template-columns: 1fr 1fr; } }
  .tile { background: var(--tile); border: 1.5px solid var(--tile-edge); border-radius: 10px; padding: 16px 18px 14px; display: grid; grid-template-columns: 22px 1fr; gap: 6px 14px; cursor: pointer; }
  .tile:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .since { margin: -6px 0 14px; font-size: 14px; color: var(--ink-2); }
  .since b { color: var(--ink); font-weight: 500; }
  .since i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin: 0 4px 0 2px; background: var(--lamp-off); vertical-align: middle; }
  .since i.green { background: var(--green); } .since i.amber { background: var(--amber); } .since i.red { background: var(--red); }
  .log { display: grid; gap: 10px; }
  .log .day { background: var(--tile); border: 1.5px solid var(--tile-edge); border-radius: 10px; padding: 14px 16px; }
  .log .day h4 { margin: 0 0 4px; font-size: 16px; font-weight: 700; font-variation-settings: "wdth" 87.5; }
  .log .day p.sum { margin: 0 0 8px; color: var(--ink-2); font-size: 14px; }
  .log .item { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--tile-edge); font-size: 14px; }
  .log .item .b { color: var(--ink-3); font-size: 12px; padding-top: 3px; }
  .log .item .r { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .tile.red { border-color: color-mix(in srgb, var(--red) 55%, var(--tile-edge)); }
  .tile.amber { border-color: color-mix(in srgb, var(--amber) 55%, var(--tile-edge)); }
  .lamp { width: 18px; height: 18px; border-radius: 50%; background: var(--lamp-off); margin-top: 3px; grid-row: 1 / span 2; }
  i.green, .lamp.green { background: var(--green); } i.amber, .lamp.amber { background: var(--amber); } i.red, .lamp.red { background: var(--red); }
  .lamp.green { box-shadow: 0 0 10px color-mix(in srgb, var(--green) 55%, transparent); }
  .lamp.amber { box-shadow: 0 0 12px color-mix(in srgb, var(--amber) 70%, transparent); }
  .lamp.red { box-shadow: 0 0 14px color-mix(in srgb, var(--red) 75%, transparent); }
  .tile h2 { margin: 0; font-size: 17px; font-weight: 700; font-variation-settings: "wdth" 87.5; line-height: 1.2; }
  .tile .tag { grid-column: 2; margin: 0 0 2px; font-size: 12.5px; color: var(--ink-3); }
  .tile .q { color: var(--ink-2); font-size: 14px; grid-column: 2; margin: 0; }
  .tile .reading { grid-column: 2; margin: 8px 0 0; font-size: 15px; }
  .tile .trip { grid-column: 2; color: var(--ink-3); font-size: 13px; margin: 3px 0 0; }
  .tile .subs { grid-column: 2; list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .tile .subs li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; align-items: start; font-size: 14px; }
  .tile .subs i { width: 11px; height: 11px; border-radius: 50%; margin-top: 5px; display: inline-block; background: var(--lamp-off); }
  .tile .subs b { font-weight: 500; } .tile .subs span { color: var(--ink-2); }
  .tile .foot { grid-column: 2; display: flex; justify-content: space-between; align-items: end; gap: 10px; margin-top: 10px; color: var(--ink-3); font-size: 12.5px; }
  .tile svg.spark { width: 84px; height: 22px; flex: none; }
  .tile .more { grid-column: 2; display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--tile-edge); font-size: 14px; color: var(--ink-2); }
  .tile .more a { color: var(--ink); overflow-wrap: anywhere; }
  .tile.open .more { display: block; }
  .status-word { font-weight: 500; }
  .status-word.green { color: var(--green); } .status-word.amber { color: var(--amber); } .status-word.red { color: var(--red); }
  .legend { margin: 26px 0 0; color: var(--ink-2); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 22px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .note { margin: 18px 0 0; color: var(--ink-3); font-size: 13.5px; max-width: 70ch; }
</style>
</head>
<body>
<div class="wrap">
  <div class="switch" role="tablist" id="switch"></div>
  <header><h1 id="title"></h1><div class="stamp" id="stamp"></div></header>
  <p class="summary" id="summary"></p>
  <p class="since" id="since"></p>
  <div class="gate" id="gate" role="status"></div>
  <div id="grid"></div>
  <div class="legend">
    <span><i style="background:var(--green)"></i>Calm</span>
    <span><i style="background:var(--amber)"></i>Watch</span>
    <span><i style="background:var(--red)"></i>Tripped</span>
    <span>Tap a tile for the evidence</span>
  </div>
  <p class="note" id="note"></p>
</div>

rd": "ai", "group": "pressure", "tag": "Pressure", "name": "Oil", "question": "Is Brent crude high enough to force more rate hikes?", "trip": "Watch at $100, amber at $110, trips at $120.", "status": "AMBER", "reading": "Brent $115 on 2026-09-22.", "evidence": "Oil is the reason rates are rising.", "source": "FRED", "value": 114.89, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-24", "status": "AMBER", "value": 114.89}, {"date": "2026-09-25", "status": "AMBER", "value": 114.89}]}], "since_last_run": [{"board": "ai", "label": "AI cycle", "kind": "status", "name": "Chips are getting easier to get", "old": "AMBER", "new": "RED", "reading": "Nvidia inventory +111% vs sales +106% (quarter ended 2026-07-26); inventory days 119. As of Sept 25 2026, H100 on-demand median is $3.44/hr (GetDeploying, 40 providers); B200 ranges $5.99–$16.11/hr with limited availabil"}, {"board": "ai", "label": "AI cycle", "kind": "value", "name": "Interest rates keep rising", "old": 4.96, "new": 5.11, "reading": "5.11% on 2026-09-23; 1 consecutive readings at or above 5%."}, {"board": "ai", "label": "AI cycle", "kind": "status", "name": "Lenders are getting nervous", "old": "AMBER", "new": "GREEN", "reading": "High-yield spread 2.80% (+0.01 pts in 60 days). OpenAI closed $122B round (March 2026, $852B valuation); Anthropic closed $65B Series H (May 2026, $965B valuation); CoreWeave guiding $12–13B 2026 revenue with $66.8B back"}]}, {"key": "fiscal", "label": "Fiscal", "title": "Fiscal dominance tripwires", "summary": "0 tripped, 5 on watch, of 12. The Fed has taken none of the four steps.", "gate": {"kind": "steps", "rung": false, "title": "The Fed has taken none of the four steps", "text": "The path from central bank to Treasury financier has four steps, each defensible on its own: bill purchases for reserve management; a crisis purchase that outlasts the crisis; political pressure to hold yields down; a stated ceiling. Step one is normal. Step two is the slope. Step three is the pressure. Step four is 1942.", "parts": [{"name": "Reserve purchases outgrow reserves", "status": "GREEN"}, {"name": "A crisis purchase that outlasts the crisis", "status": "GREEN"}, {"name": "Political pressure to hold yields down", "status": "AMBER"}, {"name": "A stated ceiling", "status": "GREEN"}]}, "groups": [{"key": "step", "title": "The four steps", "blurb": "The gate counts these. Watch is a step being approached; red is a step taken."}, {"key": "verdict", "title": "The market's verdict", "blurb": "What the people holding dollar promises are doing about it, ahead of any announcement."}, {"key": "pressure", "title": "The pressure on the Fed", "blurb": "The arithmetic and the plumbing that push toward the next step."}], "tiles": [{"id": "s1", "board": "fiscal", "group": "step", "tag": "Step 1", "name": "Reserve purchases outgrow reserves", "question": "Is the Fed buying more than the plumbing needs?", "trip": "Red when the balance sheet grows more than $100 billion beyond the growth in bank reserves over 13 weeks, or when the Fed buys coupons rather than bills. Amber while bill purchases run.", "status": "GREEN", "reading": "Fed total assets $6,748 billion, +12 billion over 13 weeks; bank reserves -21 billion over the same period. As of Sep 14 2026, the Fed announced for the second consecutive month it would not conduct reserve management purchases of T-bills through mid-October; only ~$15.6 bn in MBS reinvestment purchases remain, all in short-term bills.", "evidence": "Compare the Fed's total assets with bank reserve balances, both weekly on the H.4.1. Buying that outruns reserves is buying for the Treasury.", "source": "FRED: WALCL, WRESBAL; web check", "value": 12.0, "subs": null, "url": "https://www.bloomberg.com/news/articles/2026-09-14/fed-prolongs-pause-on-reserve-management-purchases-to-mid-oct", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": 12.0}]}, {"id": "s2", "board": "fiscal", "group": "step", "tag": "Step 2", "name": "A crisis purchase that outlasts the crisis", "question": "Has the Fed bought bonds under a financial-stability banner and kept buying after the episode ended?", "trip": "Red if purchases begun in an episode continue after the episode's own indicators (repo rates, auction results) have normalized.", "status": "GREEN", "reading": "The RMP program begun in Dec 2025 for reserve-ample conditions was explicitly tapered and paused by Aug-Sep 2026; repo rates and bank reserves (~$3.04 tn as of Sep 9) show no stress-episode persistence requiring continuation.", "evidence": "Every crisis purchase since 1987 was justified as temporary; 2008's became permanent. The tell is the second month.", "source": "Fed statements; H.4.1 via web check", "value": null, "subs": null, "url": "https://www.vantagemarkets.com/market-news/fed-pause-reserve-management-purchases-mid-october-september-15-2026/", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": null}]}, {"id": "s3", "board": "fiscal", "group": "step", "tag": "Step 3", "name": "Political pressure to hold yields down", "question": "Is the executive branch or the Treasury talking about long yields as something the Fed should manage?", "trip": "Red when the Treasury Secretary or the White House names the 10-year as a target in public, or when the Fed's independence is challenged in law.", "status": "AMBER", "reading": "Around Sep 5 2026, the president, vice president, Treasury secretary, and a senior economic counselor all publicly urged the Fed not to raise rates—an unusually broad campaign—but no executive has publicly named the 10-year or 30-year yield as a specific numerical target to be capped.", "evidence": "The 1951 Accord that freed the Fed from the Treasury followed exactly this pressure, run the other way.", "source": "Public statements via web check", "value": null, "subs": null, "url": "https://www.cnbc.com/2026/09/05/trump-warsh-fed-september-rate-hike.html", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": null}]}, {"id": "s4", "board": "fiscal", "group": "step", "tag": "Step 4", "name": "A stated ceiling", "question": "Has the Fed announced a cap on long yields?", "trip": "Red the day it is said. Amber if yield-curve control enters Fed speeches as an option.", "status": "GREEN", "reading": "The July 28-29 and June 16-17 FOMC minutes show no mention of yield-curve control, yield caps, or unlimited purchases; Chair Warsh at the Sep 16 press conference attributed higher 10-year yields to economic strength and signaled no desire to cap them.", "evidence": "Japan ran a ceiling from 2016; it held only while inflation stayed near zero and domestic savers had nowhere to go. The U.S. ran one from 1942 to 1951.", "source": "Fed communications via web check", "value": null, "subs": null, "url": "https://www.federalreserve.gov/monetarypolicy/fomcminutes20260729.htm", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": null}]}, {"id": "v1", "board": "fiscal", "group": "verdict", "tag": "Verdict", "name": "Expected inflation", "question": "Do bond investors expect inflation to stay near 2%?", "trip": "Red when 5-year-forward breakevens pass 3%; amber at 2.6%. That is the market naming the policy before the Fed does.", "status": "GREEN", "reading": "5-year, 5-year-forward breakeven 2.33%; 10-year breakeven 2.33% (2026-09-24).", "evidence": "Breakevens are the cleanest reading of whether the anchor holds; they stayed anchored through 2021 until they didn't.", "source": "FRED: T5YIFR, T10YIE", "value": 2.33, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": 2.33}]}, {"id": "v2", "board": "fiscal", "group": "verdict", "tag": "Verdict", "name": "Gold against real yields", "question": "Is the world buying the one asset that isn't a promise, even while promises pay well?", "trip": "Amber when gold is within 3% of its 52-week high while 30-year real yields sit above 2%. Red when gold makes a new high while real yields rise — the referendum going against the pyramid with the odds still in its favor.", "status": "GREEN", "reading": "Gold $4,325 (52-week high $5,318); 30-year TIPS real yield 3.14% (+0.43 over three months).", "evidence": "Gold has outrun TIPS since 2022 while breakevens stayed flat. It is hedging the regime, not the index.", "source": "Yahoo GC=F; FRED DFII30", "value": 4325.0, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": 4325.0}]}, {"id": "v3", "board": "fiscal", "group": "verdict", "tag": "Verdict", "name": "Foreign demand", "question": "Are foreign official holders still showing up for Treasuries?", "trip": "Red on a badly tailed coupon auction attributed to foreign absence or a sharp fall in the indirect-bidder share; amber on a falling trend, central-bank gold buying, yuan oil settlement.", "status": "AMBER", "reading": "At the Sep 24 2026 5-year auction ($70 bn), indirect bidders took only 54.3% vs a 65.2% average, with dealers absorbing 15.8%; Japan's Treasury holdings are down ~$51 bn in a year to $1.10 tn; though a Sep 11 30-year auction saw a record 79.5% indirect share, the trend in shorter maturities is deteriorating.", "evidence": "When foreign demand fades, the Fed becomes the marginal buyer whether it wants to or not. That is step one becoming step two by default.", "source": "TIC; auction results via web check", "value": 54.3, "subs": null, "url": "https://moderndiplomacy.eu/2026/09/25/us-treasuries-5-percent-foreign-capital-flows-japan-norway-gulf/", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 54.3}]}, {"id": "v4", "board": "fiscal", "group": "verdict", "tag": "Verdict", "name": "The long end", "question": "Is the market charging more to hold the government's longest promises?", "trip": "Red when the 30-year hold EA", "value": -1.45, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": -1.45}]}, {"id": "p2", "board": "fiscal", "group": "pressure", "tag": "Pressure", "name": "The plumbing door", "question": "Is a repo or Treasury-market seizure near enough to give the Fed the financial-stability reason to buy?", "trip": "Mirrors the plumbing board: amber while the buffer is gone, red once a seizure is under way. Step two enters through this door.", "status": "AMBER", "reading": "Stage 0 of 4 — every ingredient, no event: the buffer is gone and a drain day is near", "evidence": "The 2019 spike and the March 2020 seizure were both answered with purchases.", "source": "Plumbing board", "value": 0, "subs": null, "url": null, "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 0}]}, {"id": "p3", "board": "fiscal", "group": "pressure", "tag": "Pressure", "name": "The Fed's own position", "question": "Is the Fed politically weaker than it needs to be to keep saying no?", "trip": "Red when the Fed's losses or independence become a legislative target, or a dissent for cuts appears from a governor appointed for that purpose.", "status": "AMBER", "reading": "As of Mar 25 2026 the Fed's consolidated deferred asset stood at $244 bn; Congress's CRS noted the deferred asset was $243 bn at end-Q3 2025 and raised policy questions about the accounting treatment, while the 119th Congress CRS report flagged Trump's attempts to challenge Fed independence including trying to remove a governor for cause.", "evidence": "An institution that has to defend its own books is easier to pressure than one that doesn't. The deferred asset is about $230 billion.", "source": "Fed financials; Congress via web check", "value": 244.0, "subs": null, "url": "https://www.federalreserve.gov/monetarypolicy/May-2026-Federal-Reserve-Balance-Sheet-Developments.htm", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 244.0}]}], "since_last_run": []}, {"key": "taiwan", "label": "Taiwan", "title": "Taiwan tripwires", "summary": "0 tripped, 8 on watch, of 12. No invasion condition present; 3 on watch.", "gate": {"kind": "gate", "rung": false, "title": "No invasion condition present; 3 on watch", "text": "A blockade or invasion needs three things: a reason (a red line crossed, or Beijing declaring the peaceful path dead), an opening (the U.S. unwilling or tied down, the PLA ready, China's stockpiles full, Taiwan's clock short), and a decision (the mobilization that can't be hidden). Reason plus opening is where the risk lives; a decision means it has started. Only the reason, opening, and decision tiles count here; the markets tile confirms.", "parts": [{"name": "A reason (red line crossed, or Beijing declares the peaceful path dead)", "status": "AMBER"}, {"name": "An opening (U.S. unwilling or tied down, PLA ready, China stocked, Taiwan weak)", "status": "AMBER"}, {"name": "A decision (inspections, mobilization)", "status": "AMBER"}]}, "groups": [{"key": "reason", "title": "What would force Xi's hand", "blurb": "A red line crossed, or Beijing deciding the peaceful path is dead."}, {"key": "opening", "title": "Whether the window is open", "blurb": "Capability and opportunity. Three or more of these off green means the door is open."}, {"key": "decision", "title": "Whether a decision has been made", "blurb": "The signs that can't be hidden once a move is under way."}], "tiles": [{"id": "k1", "board": "taiwan", "group": "reason", "tag": "Reason: a red line crossed", "name": "Taipei's red lines", "question": "Has Taiwan taken a formal step toward independence, or has the U.S. recognized it?", "trip": "Trips on a referendum, a constitutional change to name or territory, a declaration, U.S. recognition, or U.S. troops. The one thing that makes a Chinese move near-certain.", "status": "GREEN", "reading": "As of Sep 25 2026, Taiwan's DPP has not attempted any constitutional change; formal amendment requires 75% of legislators plus a referendum threshold of 50% of eligible voters, making any independence declaration structurally impossible in the current split legislature.", "evidence": "Written into China's 2005 Anti-Secession Law; every leader since has repeated it.", "source": "Web check", "value": null, "subs": null, "url": "https://www.usnews.com/news/world/articles/2026-09-24/explainer-what-is-taiwan-independence-and-is-taiwan-already-independent", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": null}]}, {"id": "k2", "board": "taiwan", "group": "reason", "tag": "Reason: Beijing declares the peaceful path dead", "name": "Beijing's language", "question": "Has Beijing stopped saying 'peaceful reunification', or declared peaceful means exhausted?", "trip": "Trips when Beijing invokes the Anti-Secession Law's third condition or drops the peaceful framing. Amber when the KMT route is failing.", "status": "AMBER", "reading": "On Sep 24 2026 Xi told Trump that China's stance on 'reunification' is 'clear-cut' and urged the US to oppose Taiwan independence; his Dec 31 2025 New Year address called reunification 'unstoppable' and inaugurated an annual 'Taiwan Recovery Day', intensifying timeline pressure without formally dropping 'peaceful' language.", "evidence": "The third legal trigger is a judgment call Xi controls — which is exactly why he can wait.", "source": "Web check", "value": null, "subs": null, "url": "https://www.nst.com.my/amp/world/world/2026/09/1540966/what-taiwan-independence-and-what-does-mean-trump-and-xi", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": null}]}, {"id": "k3", "board": "taiwan", "group": "reason", "tag": "Feeds the reason", "name": "Taiwan's politics", "question": "Is Xi's peaceful route — a KMT government in 2028 — still alive?", "trip": "Amber if the KMT is losing ground or Beijing's engagement backfires; a DPP w ion": "Is the PLA's leadership settled and its amphibious force mature?", "trip": "Purges under way are a brake (green). Settled command plus maturing exercises is amber.", "status": "GREEN", "reading": "By Sep 24 2026 China had expelled Zhang Youxia and Liu Zhenli from the Party and military, leaving the CMC with only Xi and Zhang Shengmin; CSIS counts 101 senior officers purged since 2022, and analysts say the gutted command structure has set the 2027 readiness benchmark back, though routine activity continues unabated.", "evidence": "You don't fire your commanders on the eve of a war you expect to win.", "source": "Web check", "value": null, "subs": null, "url": "https://moderndiplomacy.eu/2026/09/24/chinas-military-purges-raise-a-bigger-question-can-the-pla-fight-a-major-war/", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": null}]}, {"id": "k6", "board": "taiwan", "group": "opening", "tag": "Opening", "name": "China's war chest", "question": "Are China's oil, grain, and financial reserves being built or drawn down?", "trip": "Drawing down (as in 2026) closes the window: green. Refilling fast is amber.", "status": "AMBER", "reading": "By Dec 2025 the EIA estimated China held ~1.4 bn barrels of government and NOC crude reserves (~130 days of imports, above the IEA's 90-day recommendation); consultancy FGE expected inventories to rise a further 266 mn barrels in 2026 at ~730,000 b/d; gold reserves rose to 2,346 tonnes in Q2 2026 from 2,313 tonnes in Q1.", "evidence": "1.2–1.5 billion barrels bought in 2024–25 is what let China absorb the Iran and Venezuela cuts.", "source": "Web check; customs data", "value": 1.4, "subs": null, "url": "https://en.wikipedia.org/wiki/Strategic_petroleum_reserve_(China)", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "AMBER", "value": 1.4}]}, {"id": "k7", "board": "taiwan", "group": "opening", "tag": "Opening", "name": "The substitution race", "question": "Is China neari ait exposures are being 'selectively repriced' but overall political-risk markets remain 'remarkably resilient'; no specific war-risk shipping-premium or Taiwan sovereign CDS spike reported in the last 30 days.", "evidence": "Markets price the decision before governments announce it; they also panic for other reasons, so this confirms rather than triggers.", "source": "Yahoo Finance; Polymarket; web check", "value": 11.5, "subs": null, "url": "https://www.mexc.com/it-IT/news/988807", "checked": "2026-09-25", "history": [{"date": "2026-09-25", "status": "GREEN", "value": 11.5}]}], "since_last_run": [{"board": "taiwan", "label": "Taiwan", "kind": "status", "name": "Taiwan's will", "old": "AMBER", "new": "GREEN", "reading": "An Academia Sinica survey (Jan 20-26 2026, n=1,206) found 58.7% of Taiwanese willing to resist a Chinese invasion 'at all costs' even without US military help, slightly down ~2 pct from the prior wave; a separate TVBS po"}]}], "changelog": [{"date": "2026-09-25", "first_run": false, "items": [{"board": "plumbing", "label": "Plumbing", "kind": "status", "name": "Bank stress", "old": "GREEN", "new": "AMBER", "reading": "Discount-window primary credit $6.2 billion (week of 2026-09-23). No public reports of large-bank discount window usage or deposit flight in the last 30 days; tech-sector CDS widened (Oracle ~200bp in 2026) and a new CDX"}, {"board": "market", "label": "Market", "kind": "value", "name": "Borrowing costs have jumped", "old": 4.96, "new": 5.11, "reading": "5.11% on 2026-09-23; 1 consecutive readings at or above 5%."}, {"board": "market", "label": "Market", "kind": "value", "name": "Stocks yield no more than bonds", "old": 0.22, "new": 0.13, "reading": "Forward P/E 19.1 → earnings yield 5.24% against a 10-year at 5.11%: premium +0.13 points."}, {"board": "market", "label": "Market", "kind": "value", "name": "The average stock is already falling", "old": -3.8, "new": 53.9, "reading": "S&P 500 7,740 vs 200-day 7,205 (0 closes below). 54% of 501 members below their own 200-day average (counted). Equal-weight vs cap-weight over 60 sessions: -4.3%. As of Sept 23, 2026, S&P 500 index is above its 200-DMA ("}, {"board": "market", "label": "Market", "kind": "value", "name": "Outside shock", "old": 4, "new": 5, "reading": "0 red, 5 on watch, of five."}, {"board": "ai", "label": "AI cycle", "kind": "status", "name": "Chips are getting easier to get", "old": "AMBER", "new": "RED", "reading": "Nvidia inventory +111% vs sales +106% (quarter ended 2026-07-26); inventory days 119. As of Sept 25 2026, H100 on-demand median is $3.44/hr (GetDeploying, 40 providers); B200 ranges $5.99–$16.11/hr with limited availabil"}, {"board": "ai", "label": "AI cycle", "kind": "value", "name": "Interest rates keep rising", "old": 4.96, "new": 5.11, "reading": "5.11% on 2026-09-23; 1 consecutive readings at or above 5%."}, {"board": "ai", "label": "AI cycle", "kind": "status", "name": "Lenders are getting nervous", "old": "AMBER", "new": "GREEN", "reading": "High-yield spread 2.80% (+0.01 pts in 60 days). OpenAI closed $122B round (March 2026, $852B valuation); Anthropic closed $65B Series H (May 2026, $965B valuation); CoreWeave guiding $12–13B 2026 revenue with $66.8B back"}, {"board": "taiwan", "label": "Taiwan", "kind": "status", "name": "Taiwan's will", "old": "AMBER", "new": "GREEN", "reading": "An Academia Sinica survey (Jan 20-26 2026, n=1,206) found 58.7% of Taiwanese willing to resist a Chinese invasion 'at all costs' even without US military help, slightly down ~2 pct from the prior wave; a separate TVBS po"}], "summary": "4 status change(s), 0 gate change(s), 5 notable move(s)."}]}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("tripwire-data").textContent.replace(/^\/\*TRIPWIRE_DATA\*\//, "") || "{}");
  const WORD = { green: "Calm", amber: "Watch", red: "Tripped" };
  const norm = s => ({ green: "green", amber: "amber", yellow: "amber", red: "red" })[String(s || "green").toLowerCase()] || "amber";
  const fmt = v => typeof v === "number" ? (Math.abs(v) >= 100 ? v.toLocaleString(undefined, { maximumFractionDigits: 0 }) : v.toLocaleString(undefined, { maximumFractionDigits: 2 })) : String(v);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const BELL = '<svg viewBox="0 0 56 56" aria-hidden="true"><path class="shape" d="M28 6c1.6 0 3 1.2 3 2.8v1.4c6.7 1.5 11 7.2 11 14.3v9.4l4.2 5.6c.8 1.1 0 2.7-1.4 2.7H11.2c-1.4 0-2.2-1.6-1.4-2.7L14 33.9v-9.4c0-7.1 4.3-12.8 11-14.3V8.8C25 7.2 26.4 6 28 6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M23 45.5a5 5 0 0 0 10 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const GATE = '<svg viewBox="0 0 56 56" aria-hidden="true"><rect class="shape" x="8" y="10" width="40" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><line x1="8" y1="22" x2="48" y2="22" stroke="currentColor" stroke-width="2.4"/><line x1="8" y1="34" x2="48" y2="34" stroke="currentColor" stroke-width="2.4"/></svg>';
  const STEPS = '<svg viewBox="0 0 56 56" aria-hidden="true"><path class="shape" d="M8 48h12V36h12V24h12V12h8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg>';
  const STAGES = '<svg viewBox="0 0 56 56" aria-hidden="true"><path class="shape" d="M10 14h36M10 42h36" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M18 14v28M38 14v28" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M18 28h20" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.5"/></svg>';

  function spark(history) {
    const pts = (history || []).filter(h => typeof h.value === "number");
    if (pts.length < 2) return '<svg class="spark" viewBox="0 0 84 22" aria-hidden="true"><circle cx="78" cy="11" r="2.5" fill="currentColor"/></svg>';
    const vals = pts.map(p => p.value), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1, step = 80 / (pts.length - 1);
    const d = pts.map((p, i) => `${i === 0 ? "M" : "L"}${(2 + i * step).toFixed(1)},${(19 - (p.value - lo) / span * 16).toFixed(1)}`).join(" ");
    return `<svg class="spark" viewBox="0 0 84 22" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
  }

  function tileHtml(it) {
    const s = norm(it.status);
    return `<div class="tile ${s}" tabindex="0" role="button" aria-expanded="false">
      <div class="lamp ${s}" aria-label="${WORD[s]}"></div>
      <h2>${esc(it.name)}</h2>
      ${it.tag ? `<p class="tag">${esc(it.tag)}</p>` : ""}
      <p class="q">${esc(it.question)}</p>
      <p class="reading"><span class="status-word ${s}">${WORD[s]}.</span> ${esc(it.reading)}</p>
      <p class="trip">${esc(it.trip)}</p>
      ${it.subs && it.subs.length ? `<ul class="subs">${it.subs.map(x => `<li><i class="${norm(x.status)}"></i><div><b>${esc(x.name)}.</b> <span>${esc(x.reading)}</span></div></li>`).join("")}</ul>` : ""}
      <div class="foot"><span>${esc(it.source)}${it.checked ? " · " + esc(it.checked) : ""}</span>${spark(it.history)}</div>
      <div class="more">${esc(it.evidence)}${it.url ? ` <a href="${esc(it.url)}" target="_blank" rel="noopener">Source</a>` : ""}</div>
    </div>`;
  }

  function renderBoard(b) {
    if (b.isLog) {
      document.getElementById("title").textContent = b.title;
      document.getElementById("summary").textContent = b.summary;
      const sl0 = document.getElementById("since"); if (sl0) sl0.innerHTML = "";
      document.getElementById("gate").style.display = "none";
      document.getElementById("grid").innerHTML = `<div class="log">${(DATA.changelog || []).map(d => `<div class="day"><h4>${esc(d.date)}</h4><p class="sum">${esc(d.summary)}</p>${(d.items || []).map(i => `<div class="item"><span class="b">${esc(i.label)}</span><div>${i.kind === "gate" ? `<b>Gate</b>: ${esc(i.old)} → <b>${esc(i.new)}</b>` : i.kind === "status" ? `<b>${esc(i.name)}</b>: ${esc(WORD[norm(i.old)])} → <b>${esc(WORD[norm(i.new)])}</b>` : `<b>${esc(i.name)}</b>: ${esc(fmt(i.old))} → <b>${esc(fmt(i.new))}</b>`}${i.reading ? `<div class="r">${esc(i.reading)}</div>` : ""}</div></div>`).join("")}</div>`).join("")}</div>`;
      document.getElementById("note").textContent = "Each entry compares the run with the previous one. Kept for 90 days.";
      return;
    }
    document.getElementById("gate").style.display = "";
    document.getElementById("title").textContent = b.title;
    document.getElementById("stamp").textContent = "Checked " + (DATA.updated || "");
    document.getElementById("summary").textContent = b.summary || "";
    const sl = document.getElementById("since");
    if (sl) {
      const items = b.since_last_run || [];
      sl.innerHTML = items.length ? "Since last run: " + items.map(i => i.kind === "gate" ? `<b>Gate:</b> ${esc(i.new)}` : i.kind === "status" ? `<b>${esc(i.name)}</b> <i class="${norm(i.old)}"></i>→<i class="${norm(i.new)}"></i>` : `<b>${esc(i.name)}</b> ${esc(fmt(i.old))} → ${esc(fmt(i.new))}`).join(" · ") : "Since last run: nothing moved.";
    }
    const g = b.gate || {};
    const gate = document.getElementById("gate");
    gate.classList.toggle("rung", !!g.rung);
    gate.innerHTML = ({ bell: BELL, steps: STEPS, stages: STAGES }[g.kind] || GATE) + `<div><p class="title">${esc(g.title)}</p><p>${esc(g.text)}</p><div class="parts">${(g.parts || []).map(p => `<span><i class="${norm(p.status)}"></i>${esc(p.name)}</span>`).join("")}</div></div>`;
    if (g.rung) { const sh = gate.querySelector(".shape"); if (sh) sh.setAttribute(g.kind === "steps" || g.kind === "stages" ? "stroke" : "fill", "var(--ring)"); }
    document.getElementById("grid").innerHTML = (b.groups || []).map(gr => {
      const rows = (b.tiles || []).filter(t => t.group === gr.key);
      if (!rows.length) return "";
      return `<div class="section"><h3>${esc(gr.title)}</h3><p>${esc(gr.blurb)}</p></div><div class="grid">${rows.map(tileHtml).join("")}</div>`;
    }).join("");
    document.querySelectorAll(".tile").forEach(t => {
      const toggle = () => { t.classList.toggle("open"); t.setAttribute("aria-expanded", t.classList.contains("open")); };
      t.addEventListener("click", toggle);
      t.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    });
    document.getElementById("note").textContent = (DATA.soft_checked ? "Hard data from FRED, Yahoo Finance, and SEC filings; soft signals from a web check. " : "Hard data only — soft-signal tiles were not checked on this run. ") + "Updated automatically by the tripwires script.";
  }

  const boards = (DATA.boards || []).slice();
  if (DATA.changelog) boards.push({ key: "log", label: "Log", title: "Daily change log", summary: `${DATA.changelog.length} day(s) recorded. Status changes, gate changes, and hard-data moves of ${3}% or more since the previous run.`, isLog: true });
  const sw = document.getElementById("switch");
  let current = Math.max(0, boards.findIndex(b => "#" + b.key === location.hash));
  function drawSwitch() {
    sw.innerHTML = boards.map((b, i) => {
      const reds = (b.tiles || []).filter(t => norm(t.status) === "red").length, ambers = (b.tiles || []).filter(t => norm(t.status) === "amber").length;
      return `<button role="tab" aria-selected="${i === current}" data-i="${i}">${esc(b.label || b.title)}<span class="count">${"<i class=\"red\"></i>".repeat(reds)}${"<i class=\"amber\"></i>".repeat(ambers)}</span></button>`;
    }).join("");
    sw.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => { current = +btn.dataset.i; location.hash = boards[current].key; drawSwitch(); renderBoard(boards[current]); }));
  }
  if (boards.length) { drawSwitch(); renderBoard(boards[current]); }
  else { document.getElementById("title").textContent = "Tripwires"; document.getElementById("summary").textContent = "No data yet — run tripwires.py."; document.getElementById("gate").style.display = "none"; }
  addEventListener("hashchange", () => { const i = Math.max(0, boards.findIndex(b => "#" + b.key === location.hash)); if (i !== current) { current = i; drawSwitch(); renderBoard(boards[current]); } });
})();
</script>
